name: Feature request
description: Suggest an improvement to OmaComics.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Keep examples free of private
        information, API keys, and copyrighted comic files.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe what you would like OmaComics to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or other approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional mockups or examples with sensitive information removed.
